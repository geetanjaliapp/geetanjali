name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast lint job - no DB required, quick feedback
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting
        run: ruff check .

      - name: Run type checking
        run: mypy . --ignore-missing-imports --exclude 'alembic/' --exclude 'scripts/'

  # Backend tests - runs in parallel with lint
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: geetanjali_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # torch first, from the same line the image uses, so tests and the audit see the
        # CPU build that ships rather than whatever sentence-transformers resolves on PyPI.
        run: |
          pip install "$(grep -oE 'torch==[0-9.]+' Dockerfile)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Audit installed dependencies (pip-audit)
        # Audits exactly what the tests run against, transitive deps included. Freeze before
        # fetching the auditor so its own deps stay out; pip freeze omits pip and setuptools.
        # Each ignore is an accepted risk explained where the package is pinned. Removing one
        # must turn this step red -- that is the test that the list is still load-bearing.
        # Advisory, like npm audit below: advisories publish independently of our code, so a
        # gate would turn unrelated PRs red. The step still fails visibly and annotates the run.
        continue-on-error: true
        run: |
          pip freeze > "$RUNNER_TEMP/installed.txt"
          ignores=(
            GHSA-f4j7-r4q5-qw2c GHSA-36p7-vc44-83pf  # chromadb, accepted: requirements.txt
            GHSA-2wm9-hf6c-p5cr GHSA-xph7-9rjv-w5fr  # chromadb, N/A without auth: requirements.txt
            GHSA-3qf3-8w2g-rqmx GHSA-wj6h-64fc-37mp  # python-jose / ecdsa, HS256 only: requirements.txt
            GHSA-63cw-57p8-fm3p GHSA-rrmf-rvhw-rf47 GHSA-qfhq-4f3w-5fph PYSEC-2026-139  # torch: Dockerfile
          )
          args=()
          for id in "${ignores[@]}"; do args+=(--ignore-vuln "$id"); done
          if ! pipx run pip-audit==2.10.1 -r "$RUNNER_TEMP/installed.txt" --no-deps --disable-pip \
            --progress-spinner off "${args[@]}"; then
            echo "::warning title=pip-audit::Unaccepted advisory in backend dependencies. Fix the pin or document the risk and add an ignore."
            exit 1
          fi

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/geetanjali_test
        run: alembic upgrade head

      - name: Run tests (unit + integration)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/geetanjali_test
          JWT_SECRET: test-secret-key-for-ci
          API_KEY: test-api-key-for-ci
          DEBUG: "true"
          APP_ENV: test
        run: pytest -m "unit or integration" --cov=. --cov-report=xml -v

  # Static analysis. Dependency CVEs are audited in the backend job against the installed env.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Security scan (bandit)
        run: bandit -r . -x ./tests,./alembic --severity-level medium -f txt

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          # Get main bundle size (the largest index-*.js file)
          MAIN_BUNDLE=$(ls -S dist/assets/index-*.js | head -1)
          SIZE_KB=$(du -k "$MAIN_BUNDLE" | cut -f1)
          echo "Main bundle: $MAIN_BUNDLE ($SIZE_KB KB)"

          # Fail if bundle exceeds 400KB (current: ~343KB, leaves room for growth)
          if [ "$SIZE_KB" -gt 400 ]; then
            echo "::error::Main bundle size ($SIZE_KB KB) exceeds 400KB limit"
            exit 1
          fi
          echo "✓ Bundle size check passed"

      - name: Security audit
        # Advisory only: npm audit reads a live advisory DB, so newly-disclosed
        # CVEs would otherwise turn this red on unrelated PRs with no code change.
        # Surfaces high-severity advisories without blocking merge. Real fixes
        # land via the regular `npm audit fix` / dependabot flow.
        continue-on-error: true
        run: npm audit --audit-level=high
