version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Three pins in requirements.txt are deliberate, and the python-minor group globs "*" --
    # without these, every weekly PR re-bumps them and fails CI, which trains us to ignore the
    # group entirely. Each entry mirrors a documented pin; remove it when the pin is lifted.
    ignore:
      # chromadb: every published version is affected by GHSA-f4j7-r4q5-qw2c and there is no
      # upgrade path. Accepted risk, documented at requirements.txt:19-37. Re-check for a
      # patched release rather than letting Dependabot re-raise it weekly.
      - dependency-name: "chromadb"
      # bcrypt 5.0.0 is incompatible with passlib 1.7.4 (requirements.txt:63).
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint peers "typescript: >=4.8.4 <6.1.0" as of 8.66.0, so TS 7 fails
      # `npm ci` with ERESOLVE before any test runs. We are on TS 6, which that range allows.
      # Lift when typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # Docker
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
